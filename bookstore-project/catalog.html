<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bookstore Inventory</title>
    <style>
      body {
        font-family: Georgia, "Times New Roman", serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #ddd;
      }
      h1 {
        font-size: 2.2em;
      }
      .book-title {
        font-weight: bold;
        font-size: 1.2em;
        margin-top: 15px;
      }
      .book-info {
        margin-left: 25px;
        line-height: 1.6;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <h1>Bookstore Inventory</h1>
    <ul id="inventoryList">
      <!-- left this empty on purpose, the JS below fills it in from the JSON data -->
    </ul>

    <script>
      const listEl = document.getElementById("inventoryList");

      fetch("catalog.json")
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Catalog file was not found.");
          }
          return response.json();
        })
        .then(function (data) {
          data.bookstoreInventory.forEach(function (book) {
            const item = document.createElement("li");
            const title = document.createElement("div");
            title.className = "book-title";
            title.textContent = book.title;

            const info = document.createElement("div");
            info.className = "book-info";
            info.textContent =
              "Author: " +
              book.author.firstName +
              " " +
              book.author.lastName +
              "\nPublication Year: " +
              book.publicationYear +
              "\nPublisher: " +
              book.details.publisher +
              "\nPage Count: " +
              book.details.pageCount +
              "\nAvailable: " +
              (book.details.available ? "Yes" : "No");

            item.append(title, info);
            listEl.appendChild(item);
          });
        })
        .catch(function () {
          listEl.textContent =
            "The book list could not be loaded. Start a local server in this folder, then open this page from that server.";
        });
    </script>
  </body>
</html>
